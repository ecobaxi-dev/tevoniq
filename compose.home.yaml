# Reuses the existing local database volume. This file does not initialize/import content.
name: tevoniq
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Keep the existing .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Keep the existing database password}
      POSTGRES_DB: ${POSTGRES_DB:?Keep the existing database name}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  migrate:
    profiles: [tools]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGIN: ${SITE_URL:?Set the HTTPS test hostname}
      MEDIA_STORAGE: disabled
      EMAIL_TRANSPORT: resend
      EMAIL_FROM: ${EMAIL_FROM:?Set verified sender}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set private Resend key}
      TURNSTILE_MODE: turnstile
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set site key}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set private key}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:?Set allowed hostnames}
      LEAD_PROXY_SECRET: ${LEAD_PROXY_SECRET:?Set matching proxy secret}
      LOG_LEVEL: warn
    networks: [database, application]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 6s
      retries: 10
    restart: unless-stopped
    init: true
    mem_limit: 1g
    security_opt: ['no-new-privileges:true']
    logging: *logging
  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      API_URL: http://api:4000/api/v1
      SITE_URL: ${SITE_URL:?Set the HTTPS test hostname}
      LEAD_PROXY_SECRET: ${LEAD_PROXY_SECRET:?Set matching proxy secret}
      LEAD_CLIENT_IP_HEADER: cf-connecting-ip
    ports: ['127.0.0.1:3000:3000']
    networks: [application]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 6s
      retries: 10
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    security_opt: ['no-new-privileges:true']
    logging: *logging
networks:
  database:
    internal: true
  application:
volumes:
  postgres_data:
    external: true
    name: tevoniq_postgres_data
